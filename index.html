<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Ledger</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">Personal finance / local-first</p><h1>Expense ledger</h1><p class="lede">A quiet record of where the month goes.</p></header><section class="summary"><div><span>Total tracked</span><strong id="total">$0.00</strong></div><div><span>Entries</span><strong id="count">0</strong></div></section><section class="workspace"><form id="expense-form"><h2>Add expense</h2><label>Description<input name="description" required placeholder="Groceries"></label><label>Amount<input name="amount" required type="number" min="0.01" step="0.01" placeholder="42.50"></label><label>Category<select name="category"><option>Food</option><option>Transport</option><option>Home</option><option>Health</option><option>Other</option></select></label><button>Add to ledger</button></form><section><h2>Recent expenses</h2><ul id="expenses" class="expenses"><li>No expenses yet.</li></ul></section></section></main><script src="app.js"></script></body></html>
